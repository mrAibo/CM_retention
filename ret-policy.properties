# cm-retention default policy template
#
# A policy can be created directly from this file with:
#   bin/cm-retention create --properties ret-policy.properties
#
# Precedence when creating a policy:
#   explicit CLI POLICY/AGE/options > --properties FILE > default file > built-in fallback
#
# The semantic policy mode remains intentionally constrained to the safe workflow
# supported by cm-retention: FIXED_TIME, retention disabled, expiration enabled,
# AUTO_DELETE. Unsupported semantic values are rejected instead of silently used.

RET_POLICY_NAME=AUTO_DELETE_1Y

retention.type=FIXED_TIME
retention.enabled=false

expiration.enabled=true
expiration.age=1y
expiration.action=AUTO_DELETE

auto-delete.schedule=0 2 * * *
auto-delete.commit-count=100
auto-delete.max-items=5000
auto-delete.max-duration=120
auto-delete.force-checkin=true

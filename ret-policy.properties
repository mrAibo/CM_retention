# cm-retention default policy template
#
# Kurzform:
#   bin/cm-retention create ret-policy.properties
#
# Explizite Form:
#   bin/cm-retention create --properties ret-policy.properties
#
# Prioritaet bei create:
#   CLI POLICY/AGE/options > ausgewaehlte properties-Datei > built-in fallback
#
# Hinweis:
# cm-retention unterstuetzt beim Erstellen derzeit bewusst nur:
#   FIXED_TIME + Retention deaktiviert + Expiration aktiviert + AUTO_DELETE
# Andere semantische Werte werden aus Sicherheitsgruenden abgelehnt.

# Name der in IBM Content Manager anzulegenden Retention Policy.
# Pflichtfeld fuer jede explizit verwendete Properties-Vorlage.
RET_POLICY_NAME=AUTO_DELETE_1Y

# Typ der Retention Policy.
# FIXED_TIME bedeutet eine zeitbasierte Policy mit fester Frist.
# Derzeit wird nur FIXED_TIME unterstuetzt.
retention.type=FIXED_TIME

# Aktiviert/deaktiviert die eigentliche Retention-Sperre.
# false = keine separate Retention-Sperrfrist; cm-retention verwendet in diesem
# Workflow nur Expiration/AUTO_DELETE.
# Derzeit wird nur false unterstuetzt.
retention.enabled=false

# Aktiviert die Expiration-Funktion der Policy.
# true = Dokumente koennen nach Ablauf der Frist fuer die konfigurierte
# Expiration-Aktion verarbeitet werden.
# Derzeit wird nur true unterstuetzt.
expiration.enabled=true

# Ablaufdauer ab Erstellungszeitpunkt eines Objekts.
# Erlaubte Einheiten:
#   y = Jahre, m = Monate, w = Wochen, d = Tage
# Beispiele: 1y, 6m, 52w, 365d
# Beim --backfill wird daraus fuer bestehende Objekte z.B.
# ICM$AUTODELETEDATE = CREATETS + 1 YEAR berechnet.
expiration.age=1y

# Aktion nach Erreichen des Ablaufdatums.
# AUTO_DELETE = IBM CM darf abgelaufene Objekte ueber seinen automatischen
# Loeschmechanismus verarbeiten.
# Derzeit wird nur AUTO_DELETE unterstuetzt.
expiration.action=AUTO_DELETE

# Zeitplan fuer den automatischen Delete-Lauf.
# Standard: 0 2 * * * = taeglich um 02:00 Uhr.
# Format entspricht der von IBM CM verwendeten Schedule-Information.
auto-delete.schedule=0 2 * * *

# Anzahl verarbeiteter Objekte zwischen zwei Commits beim automatischen
# Loeschen. Ein kleinerer Wert commitet haeufiger, ein groesserer Wert fasst
# mehr Loeschungen pro Transaktion zusammen.
auto-delete.commit-count=100

# Maximale Anzahl von Objekten, die ein automatischer Delete-Lauf verarbeitet.
# 0 = kein Item-Limit.
auto-delete.max-items=5000

# Maximale Laufzeit eines automatischen Delete-Laufs in SEKUNDEN.
# Beispiel: 120 = 120 Sekunden = 2 Minuten.
auto-delete.max-duration=120

# "Einchecken vor Loeschen erzwingen".
# true = ausgecheckte Objekte werden vor dem automatischen Loeschen zwangsweise
# eingecheckt, damit der Delete-Lauf nicht allein am Checkout-Zustand scheitert.
# false = kein erzwungenes Check-in.
auto-delete.force-checkin=true

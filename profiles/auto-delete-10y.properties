# AUTO_DELETE 10 year template
#
# Erstellen mit:
#   bin/cm-retention create profiles/auto-delete-10y.properties

# Name der anzulegenden Retention Policy.
RET_POLICY_NAME=AUTO_DELETE_10Y

# Policy-Typ. FIXED_TIME = feste zeitbasierte Frist.
retention.type=FIXED_TIME

# Separate Retention-Sperre deaktiviert; dieser Workflow nutzt Expiration.
retention.enabled=false

# Expiration/Ablaufverarbeitung aktivieren.
expiration.enabled=true

# Ablaufdauer ab Erstellungszeitpunkt: 10 Jahre.
# Einheiten: y=Jahre, m=Monate, w=Wochen, d=Tage.
expiration.age=10y

# Nach Fristablauf fuer automatisches Loeschen freigeben.
expiration.action=AUTO_DELETE

# Zeitplan des automatischen Delete-Laufs: taeglich 02:00 Uhr.
auto-delete.schedule=0 2 * * *

# Nach jeweils 100 verarbeiteten Objekten committen.
auto-delete.commit-count=100

# Pro Delete-Lauf maximal 5000 Objekte verarbeiten; 0 = unbegrenzt.
auto-delete.max-items=5000

# Maximale Laufzeit eines Delete-Laufs in SEKUNDEN.
# 120 = 120 Sekunden = 2 Minuten.
auto-delete.max-duration=120

# "Einchecken vor Loeschen erzwingen".
# true = ausgecheckte Objekte vor dem Loeschen zwangsweise einchecken.
auto-delete.force-checkin=true

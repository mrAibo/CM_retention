# cm-retention Oracle 19c policy template: AUTO_DELETE_1Y
#
# IBM Content Manager uses Oracle calendaring syntax for the automatic-delete
# schedule when the Library Server database is Oracle. The policy semantics are
# otherwise identical to the DB2 1-year template.

# Name of the retention policy to create.
RET_POLICY_NAME=AUTO_DELETE_1Y

# cm-retention currently creates fixed-time policies only.
retention.type=FIXED_TIME

# Retention itself is disabled; only expiration/AUTO_DELETE is used.
retention.enabled=false

# Enable expiration handling.
expiration.enabled=true

# Expiration age: 1 year after item creation.
expiration.age=1y

# Automatically delete expired items according to the schedule below.
expiration.action=AUTO_DELETE

# Oracle automatic-delete schedule (Oracle calendaring syntax).
# This runs daily at 02:00:00.
auto-delete.schedule=FREQ=DAILY;BYHOUR=2;BYMINUTE=0;BYSECOND=0;

# Commit after this many deleted items.
auto-delete.commit-count=100

# Maximum number of items processed in one automatic-delete run.
# 0 would mean unlimited.
auto-delete.max-items=5000

# Maximum runtime of one automatic-delete run in SECONDS.
# 120 = 120 seconds = 2 minutes.
auto-delete.max-duration=120

# Force check-in before deleting an expired checked-out item.
auto-delete.force-checkin=true
